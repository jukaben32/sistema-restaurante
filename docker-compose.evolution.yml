# Evolution API (WhatsApp) en tu VPS, para usarlo con la app desplegada en Vercel.
# Vercel NO puede ejecutar Evolution (necesita un proceso encendido 24 h); por eso va en un servidor aparte.
# Despliégalo en Dokploy como un proyecto Compose independiente (ver docs/DESPLIEGUE-VERCEL.md).
#
# Variables (Dokploy → Environment):
#   EVOLUTION_DOMAIN       evolution.tudominio.com   (con DNS apuntando al VPS; Traefik le pone HTTPS)
#   EVOLUTION_API_KEY      llave global larga y aleatoria  (la misma que pondrás en Vercel)
#   EVOLUTION_DB_PASSWORD  contraseña aleatoria del Postgres interno
#   EVOLUTION_IMAGE        (opcional) verifica la versión vigente en https://doc.evolution-api.com
#
# ⚠️ No se pudo probar Docker en el equipo de desarrollo: revisa los logs en el primer despliegue.
services:
  evolution-api:
    image: ${EVOLUTION_IMAGE:-atendai/evolution-api:v2.2.3}
    restart: unless-stopped
    environment:
      SERVER_URL: https://${EVOLUTION_DOMAIN}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - evolution-db
      - evolution-redis
    networks:
      - dokploy-network
      - interna
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evolution.rule=Host(`${EVOLUTION_DOMAIN}`)"
      - "traefik.http.routers.evolution.entrypoints=websecure"
      - "traefik.http.routers.evolution.tls.certresolver=letsencrypt"
      - "traefik.http.services.evolution.loadbalancer.server.port=8080"

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    networks:
      - interna

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - evolution_redis:/data
    networks:
      - interna

volumes:
  evolution_instances:
  evolution_pgdata:
  evolution_redis:

networks:
  dokploy-network:
    external: true
  interna:
    driver: bridge
